# qmail stack secrets — defaults mirror docker/.env.example.
# OVERRIDE ALL OF THESE before any real deployment:
#   helm install qmail helm/qmail \
#     --set secret.mysqlRootPass=... --set secret.mysqlPass=... \
#     --set secret.greylistPass=... --set secret.rspamdPassword=... \
#     --set secret.vqadminPass=... --set secret.qmailApiKey=...
apiVersion: v1
kind: Secret
metadata:
  name: qmail-secrets
  labels:
    app.kubernetes.io/name: qmail
type: Opaque
stringData:
  MYSQL_ROOT_PASS: {{ .Values.secret.mysqlRootPass | default "changeme_root" | quote }}
  MYSQL_PASS: {{ .Values.secret.mysqlPass | default "changeme" | quote }}
  GREYLIST_PASS: {{ .Values.secret.greylistPass | default "changeme_grey" | quote }}
  RSPAMD_PASSWORD: {{ .Values.secret.rspamdPassword | default "changeme_rspamd" | quote }}
  VQADMIN_PASS: {{ .Values.secret.vqadminPass | default "changeme" | quote }}
  QMAIL_API_KEY: {{ .Values.secret.qmailApiKey | default "" | quote }}
  # Optional: postmaster password for the primary vpopmail domain (first run
  # only). When unset the entrypoint generates one and persists it to
  # control/postmaster.passwd on the maildata volume (mode 600).
  {{- if .Values.secret.postmasterPass }}
  POSTMASTER_PASS: {{ .Values.secret.postmasterPass | quote }}
  {{- end }}
  # Optional backend credentials — emitted only when set (dovecot pgsql/ldap).
  {{- if .Values.secret.pgsqlPass }}
  PGSQL_PASS: {{ .Values.secret.pgsqlPass | quote }}
  {{- end }}
  {{- if .Values.secret.ldapBindPw }}
  LDAP_BIND_PW: {{ .Values.secret.ldapBindPw | quote }}
  {{- end }}
