# mariadb 11 — vpopmail auth + greylisting backend. Single instance (RWO PVC).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  labels:
    app.kubernetes.io/name: qmail
    app.kubernetes.io/component: mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mariadb-env
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: qmail-secrets, key: MYSQL_ROOT_PASS }
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: qmail-secrets, key: MYSQL_PASS }
            - name: GREYLIST_PASS
              valueFrom:
                secretKeyRef: { name: qmail-secrets, key: GREYLIST_PASS }
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mariadb-data }
        - name: init
          configMap:
            name: qmail-mariadb-init
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
