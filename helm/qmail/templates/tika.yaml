# apache tika — attachment text extraction for rspamd.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  labels:
    app.kubernetes.io/name: qmail
    app.kubernetes.io/component: tika
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: tika
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tika
    spec:
      {{- with .Values.tika.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tika.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tika
          image: apache/tika:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_OPTS
              value: {{ .Values.tika.javaOpts | quote }}
          ports:
            - name: tika
              containerPort: 9998
          readinessProbe:
            tcpSocket:
              port: 9998
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tika
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: tika
  ports:
    - name: tika
      port: 9998
      targetPort: 9998
