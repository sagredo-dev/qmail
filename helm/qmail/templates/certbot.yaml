{{- if .Values.certbot.enabled }}
# certbot — Let's Encrypt issue/renew (mirrors the docker "certbot" profile).
# Certs land in the letsencrypt PVC, served through qmail's lighttpd webroot.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: certbot
  labels:
    app.kubernetes.io/name: qmail
    app.kubernetes.io/component: certbot
spec:
  schedule: {{ .Values.certbot.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: certbot
              image: certbot/certbot:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: CERTBOT_EMAIL
                  value: {{ .Values.certbot.email | quote }}
                - name: CERTBOT_DOMAIN
                  value: {{ .Values.certbot.domain | default .Values.qmail.me | quote }}
              args:
                - certonly
                - --webroot
                - --webroot-path
                - /var/www/acme
                - --email
                - $(CERTBOT_EMAIL)
                - --agree-tos
                - --non-interactive
                - --keep-until-expiring
                - -d
                - $(CERTBOT_DOMAIN)
              volumeMounts:
                - name: acme
                  mountPath: /var/www/acme
                - name: letsencrypt
                  mountPath: /etc/letsencrypt
          volumes:
            - name: acme
              persistentVolumeClaim: { claimName: acme-webroot }
            - name: letsencrypt
              persistentVolumeClaim: { claimName: letsencrypt }
{{- end }}
