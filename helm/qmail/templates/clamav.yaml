# clamav — virus definitions + clamd. Slow first start (definition load ~5 min).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  labels:
    app.kubernetes.io/name: qmail
    app.kubernetes.io/component: clamav
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/component: clamav
    spec:
      containers:
        - name: clamav
          image: "{{ .Values.clamav.image.registry }}/{{ .Values.clamav.image.repository }}:{{ .Values.clamav.image.tag }}"
          imagePullPolicy: {{ .Values.clamav.image.pullPolicy }}
          ports:
            - name: clamd
              containerPort: 3310
          readinessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /var/lib/clamav
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: clamav-data }
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: 3310
