# qmail — the MTA core. Single instance. hostPorts bind the real SMTP ports
# on the node (k3s NodePort range can't carry 25/465/587).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qmail
  labels:
    app.kubernetes.io/name: qmail
    app.kubernetes.io/component: qmail
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: qmail
  template:
    metadata:
      labels:
        app.kubernetes.io/component: qmail
    spec:
      {{- with .Values.qmail.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.qmail.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-mariadb
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z mariadb 3306; do echo waiting for mariadb; sleep 3; done"]
      containers:
        - name: qmail
          image: {{ .Values.image.registry }}/qmail:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: qmail-env
            - secretRef:
                name: qmail-secrets
          ports:
            - name: smtp
              containerPort: 25
              {{- if .Values.service.useHostPort }}
              hostPort: 25
              {{- end }}
            - name: http
              containerPort: 80
              {{- if .Values.service.useHostPort }}
              hostPort: 80
              {{- end }}
            - name: smtps
              containerPort: 465
              {{- if .Values.service.useHostPort }}
              hostPort: 465
              {{- end }}
            - name: submission
              containerPort: 587
              {{- if .Values.service.useHostPort }}
              hostPort: 587
              {{- end }}
          readinessProbe:
            tcpSocket:
              port: 25
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: maildata
              mountPath: /srv/mail
            - name: maildirs
              mountPath: /srv/mail/vpopmail/domains
            - name: acme
              mountPath: /var/www/acme
            - name: letsencrypt
              mountPath: /etc/letsencrypt
              readOnly: true
          {{- with .Values.qmail.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: maildata
          persistentVolumeClaim: { claimName: maildata }
        - name: maildirs
          persistentVolumeClaim: { claimName: maildirs }
        - name: acme
          persistentVolumeClaim: { claimName: acme-webroot }
        - name: letsencrypt
          persistentVolumeClaim: { claimName: letsencrypt }
---
apiVersion: v1
kind: Service
metadata:
  name: qmail
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: qmail
  ports:
    - name: smtp
      port: 25
      targetPort: 25
    - name: http
      port: 80
      targetPort: 80
    - name: smtps
      port: 465
      targetPort: 465
    - name: submission
      port: 587
      targetPort: 587
