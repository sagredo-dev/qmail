{{- /* Persistent volumes. local-path is RWO: maildata+maildirs are shared by
       qmail AND dovecot → those two pods are pinned to the same node. */}}
{{- $sc := .Values.storageClass }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maildata
spec:
  accessModes: [ReadWriteOnce]
{{- if $sc }}
  storageClassName: {{ $sc | quote }}
{{- end }}
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maildirs
spec:
  accessModes: [ReadWriteOnce]
{{- if $sc }}
  storageClassName: {{ $sc | quote }}
{{- end }}
  resources:
    requests:
      storage: 20Gi
---
