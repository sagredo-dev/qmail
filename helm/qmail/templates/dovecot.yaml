# dovecot — IMAPS/POP3S/Sieve + LMTP delivery. Shares maildata (ro) and
# maildirs (rw) with qmail → pinned to the qmail node (RWO local-path).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dovecot
  labels:
    app.kubernetes.io/name: qmail
    app.kubernetes.io/component: dovecot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: dovecot
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dovecot
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: qmail
              topologyKey: kubernetes.io/hostname
      {{- with .Values.dovecot.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dovecot.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-maildata
          image: {{ .Values.image.registry }}/qmail-dovecot:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "until [ -f /srv/qmail/qmail/control/me ]; do echo waiting for qmail control files; sleep 3; done"]
          volumeMounts:
            - name: maildata
              mountPath: /srv/qmail
              readOnly: true
      containers:
        - name: dovecot
          image: {{ .Values.image.registry }}/qmail-dovecot:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: dovecot-env
            - secretRef:
                name: qmail-secrets
          ports:
            - name: lmtp
              containerPort: 24
            - name: imaps
              containerPort: 993
              {{- if .Values.service.useHostPort }}
              hostPort: 993
              {{- end }}
            - name: pop3s
              containerPort: 995
              {{- if .Values.service.useHostPort }}
              hostPort: 995
              {{- end }}
            - name: sieve
              containerPort: 4190
              {{- if .Values.service.useHostPort }}
              hostPort: 4190
              {{- end }}
          readinessProbe:
            tcpSocket:
              port: 993
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: maildirs
              mountPath: /srv/mail/vpopmail/domains
            - name: maildata
              mountPath: /srv/qmail
              readOnly: true
          {{- with .Values.dovecot.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: maildirs
          persistentVolumeClaim: { claimName: maildirs }
        - name: maildata
          persistentVolumeClaim: { claimName: maildata }
---
apiVersion: v1
kind: Service
metadata:
  name: dovecot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: dovecot
  ports:
    - name: lmtp
      port: 24
      targetPort: 24
    - name: imaps
      port: 993
      targetPort: 993
    - name: pop3s
      port: 995
      targetPort: 995
    - name: sieve
      port: 4190
      targetPort: 4190
