{{- if .Values.oletools.enabled }}
# oletools — OLE macro scanner (opt-in, mirrors the docker "macros" profile).
# When down, rspamd times out and passes mail through (fail-open).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oletools
  labels:
    app.kubernetes.io/name: qmail
    app.kubernetes.io/component: oletools
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: oletools
  template:
    metadata:
      labels:
        app.kubernetes.io/component: oletools
    spec:
      containers:
        - name: oletools
          image: {{ .Values.image.registry }}/qmail-oletools:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
{{- range $k, $v := .Values.oletools.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
{{- end }}
          ports:
            - name: olefy
              containerPort: 11343
          readinessProbe:
            tcpSocket:
              port: 11343
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: oletools
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: oletools
  ports:
    - name: olefy
      port: 11343
      targetPort: 11343
{{- end }}
