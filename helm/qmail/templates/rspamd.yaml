# rspamd — spam filtering + feature layers. Configs from the repo live in
# ConfigMaps qmail-rspamd-local / qmail-rspamd-lua (docker/rspamd/).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rspamd
  labels:
    app.kubernetes.io/name: qmail
    app.kubernetes.io/component: rspamd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: rspamd
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rspamd
    spec:
      initContainers:
        - name: wait-redis
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting for redis; sleep 3; done"]
      containers:
        - name: rspamd
          image: {{ .Values.image.registry }}/qmail-rspamd:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: rspamd-env
            - secretRef:
                name: qmail-secrets
          ports:
            - name: controller
              containerPort: 11333
            - name: ui
              containerPort: 11334
          readinessProbe:
            tcpSocket:
              port: 11333
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: locald
              mountPath: /etc/rspamd/local.d
              readOnly: true
            - name: luad
              mountPath: /etc/rspamd/lua.local.d
              readOnly: true
            - name: data
              mountPath: /var/lib/rspamd
      volumes:
        - name: locald
          configMap:
            name: qmail-rspamd-local
        - name: luad
          configMap:
            name: qmail-rspamd-lua
        - name: data
          persistentVolumeClaim: { claimName: rspamd-data }
---
apiVersion: v1
kind: Service
metadata:
  name: rspamd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: rspamd
  ports:
    - name: controller
      port: 11333
      targetPort: 11333
    - name: ui
      port: 11334
      targetPort: 11334
